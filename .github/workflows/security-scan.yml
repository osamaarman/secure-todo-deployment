name: Security Scanning

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  bandit:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install --break-system-packages bandit

      - name: Run Bandit on backend
        run: bandit -r backend/ -f txt -o bandit-report.txt --exit-zero

      - name: Show Bandit report
        run: cat bandit-report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  hadolint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
          output-file: hadolint-backend-report.txt
          no-fail: true

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error
          output-file: hadolint-frontend-report.txt
          no-fail: true

      - name: Show Hadolint reports
        run: |
          echo "=== Backend Dockerfile ==="
          cat hadolint-backend-report.txt || echo "no issues"
          echo "=== Frontend Dockerfile ==="
          cat hadolint-frontend-report.txt || echo "no issues"

      - name: Upload Hadolint reports
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-reports
          path: hadolint-*-report.txt
